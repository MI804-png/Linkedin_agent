services:
  - type: web
    name: linkedin-autoapply
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # upgrade to starter for persistent disk
    envVars:
      - key: FLASK_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: linkedin-autoapply-db
          property: connectionString

databases:
  - name: linkedin-autoapply-db
    plan: free
    databaseName: autoapply
    user: autoapply
