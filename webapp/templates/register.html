{% extends "base.html" %}
{% block title %}Register – AutoApply{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-3">
      <h4 class="fw-bold mb-1"><i class="bi bi-person-plus me-1"></i> Create Account</h4>
      <p class="text-muted small mb-4">Free to use. No credit card required.</p>

      <form method="post" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <input type="email" name="email" class="form-control" required
                 placeholder="you@example.com" value="{{ request.form.get('email','') }}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required
                 placeholder="At least 8 characters">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm password</label>
          <input type="password" name="password2" class="form-control" required
                 placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="bi bi-check-circle me-1"></i> Create account
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center text-muted small">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
